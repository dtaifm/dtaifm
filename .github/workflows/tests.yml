name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core + dev only (no provider SDKs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (no provider SDKs installed)
        run: pytest -v

      - name: Install with anthropic optional extra
        run: pip install -e ".[dev,anthropic]"

      - name: Re-run test suite (with anthropic SDK installed; no network calls)
        run: pytest -v

      - name: Run Python smart home demo
        run: python examples/smart_rules/demo.py

      - name: CLI validate (expected exit 1 — rules.yaml includes an unsafe rule)
        run: |
          set +e
          dtaifm validate examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 (unsafe rule present), got $code"
            exit 1
          fi

      - name: CLI run (expected exit 0)
        run: |
          dtaifm run examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml \
            --state examples/smart_rules/state.json

      - name: CLI run --json (smoke-check JSON parses)
        run: |
          dtaifm run examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml \
            --state examples/smart_rules/state.json --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: CLI schema (smoke-check JSON Schemas emit + parse)
        run: |
          for kind in constraints rules state; do
            dtaifm schema "$kind" | python -c "import json,sys; json.load(sys.stdin)"
          done

      - name: CLI propose -> review chain
        run: |
          dtaifm propose examples/smart_rules/constraints.yaml --teacher mock --out /tmp/proposed.yaml
          dtaifm review examples/smart_rules/constraints.yaml /tmp/proposed.yaml \
            --state examples/smart_rules/state.json --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['schema_version']=='0.1'; assert d['proposals']"

      - name: CLI network_automation propose -> review chain
        run: |
          dtaifm propose examples/network_automation/constraints.yaml \
            --teacher mock --domain network_automation --out /tmp/na.yaml
          dtaifm review --domain network_automation \
            examples/network_automation/constraints.yaml /tmp/na.yaml \
            --state examples/network_automation/state.json --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert 'r_apply_router_config_safely' in d['execution']['triggered_rule_ids']"

      - name: CLI bundle -> replay chain (smart_home)
        run: |
          dtaifm review examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml \
            --state examples/smart_rules/state.json --bundle /tmp/sh.json > /dev/null
          dtaifm inspect /tmp/sh.json --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['domain']['id']=='smart_home'"
          dtaifm replay /tmp/sh.json

      - name: CLI bundle -> replay chain (network_automation)
        run: |
          dtaifm review --domain network_automation \
            examples/network_automation/constraints.yaml examples/network_automation/rules.yaml \
            --state examples/network_automation/state.json --bundle /tmp/na-bundle.json > /dev/null
          dtaifm replay /tmp/na-bundle.json

      - name: CLI replay detects tampering (expected exit 1)
        run: |
          dtaifm review examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml \
            --state examples/smart_rules/state.json --bundle /tmp/tamper.json > /dev/null
          python -c "import json; b=json.load(open('/tmp/tamper.json')); b['inputs']['constraints']['content'][0]['action']='TAMPERED'; json.dump(b, open('/tmp/tamper.json','w'))"
          set +e
          dtaifm replay /tmp/tamper.json > /dev/null
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 from tampered replay, got $code"
            exit 1
          fi

      - name: CLI teachers lists local providers (no network)
        run: |
          dtaifm teachers --json \
            | python -c "import json,sys; d=json.load(sys.stdin); names={i['name'] for i in d}; assert {'mock','anthropic','openai','ollama','lemonade'}.issubset(names), names"

      - name: CLI teachers --check reports offline gracefully (unreachable ports)
        env:
          DTAIFM_OLLAMA_BASE_URL: http://127.0.0.1:1
          DTAIFM_LEMONADE_BASE_URL: http://127.0.0.1:2
        run: |
          dtaifm teachers --check --json \
            | python -c "import json,sys; d=json.load(sys.stdin); by={i['name']:i for i in d}; assert by['ollama']['status']=='offline'; assert by['lemonade']['status']=='offline'"

      - name: CLI feedback -> repropose -> validate loop (smart_home)
        run: |
          dtaifm feedback examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml --out /tmp/fb.json
          python -c "import json; d=json.load(open('/tmp/fb.json')); assert d['schema_version']=='0.1'; assert any(r['rule_id']=='r_auto_unlock_door' for r in d['rejected_rules'])"
          dtaifm repropose examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml \
            --teacher mock --out /tmp/revised.yaml
          # The revised file must now pass validation (mock teacher dropped the unsafe rule)
          dtaifm validate examples/smart_rules/constraints.yaml /tmp/revised.yaml

      - name: CLI feedback -> repropose loop (network_automation)
        run: |
          dtaifm feedback --domain network_automation \
            examples/network_automation/constraints.yaml examples/network_automation/rules.yaml \
            --out /tmp/na-fb.json
          python -c "import json; d=json.load(open('/tmp/na-fb.json')); assert any(r['rule_id']=='r_disable_mgmt_unsafe' for r in d['rejected_rules'])"
          dtaifm repropose --domain network_automation \
            examples/network_automation/constraints.yaml examples/network_automation/rules.yaml \
            --teacher mock --out /tmp/na-revised.yaml
          dtaifm validate --domain network_automation \
            examples/network_automation/constraints.yaml /tmp/na-revised.yaml

      - name: CLI demo smoke (smart_home)
        run: |
          dtaifm demo smart_home --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['replay']['success']; assert d['approved_count']==2; assert d['rejected_count']==1"

      - name: CLI demo smoke (network_automation)
        run: |
          dtaifm demo network_automation --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['replay']['success']; assert 'r_apply_router_config_safely' in d['triggered_rule_ids']"

      - name: Lint with ruff
        run: ruff check dtaifm tests

  release-readiness:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl

      - name: Smoke-test installed CLI
        run: |
          /tmp/wheel-venv/bin/dtaifm --help
          /tmp/wheel-venv/bin/dtaifm teachers --json \
            | python -c "import json,sys; d=json.load(sys.stdin); names={i['name'] for i in d}; assert {'mock','anthropic','openai','ollama','lemonade'}.issubset(names)"

      - name: Smoke-test installed CLI on the smart_home example
        run: |
          # Validate exits 1 because the example file contains one deliberately unsafe rule
          set +e
          /tmp/wheel-venv/bin/dtaifm validate examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml
          code=$?
          if [ "$code" -ne 1 ]; then echo "Expected exit 1 from validate, got $code"; exit 1; fi
          /tmp/wheel-venv/bin/dtaifm review examples/smart_rules/constraints.yaml examples/smart_rules/rules.yaml \
            --state examples/smart_rules/state.json --bundle /tmp/sh.json
          /tmp/wheel-venv/bin/dtaifm replay /tmp/sh.json

      - name: Smoke-test installed CLI demo command (both built-in domains, fully offline)
        run: |
          /tmp/wheel-venv/bin/dtaifm demo smart_home --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['replay']['success']"
          /tmp/wheel-venv/bin/dtaifm demo network_automation --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['replay']['success']"
